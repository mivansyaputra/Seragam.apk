name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan folder www
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set app icon
        run: |
          if command -v magick >/dev/null 2>&1; then IM="magick"; else IM="convert"; fi
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; size=${d##*:}
            $IM icon.png -background white -gravity center \
              -resize ${size}x${size} -extent ${size}x${size} \
              $RES/mipmap-$name/ic_launcher.png
            cp $RES/mipmap-$name/ic_launcher.png $RES/mipmap-$name/ic_launcher_round.png
            cp $RES/mipmap-$name/ic_launcher.png $RES/mipmap-$name/ic_launcher_foreground.png
          done

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seragam-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
