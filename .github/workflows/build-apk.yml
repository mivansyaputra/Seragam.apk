name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan folder www
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set app icon
        run: |
          pip install pillow
          python3 - <<'EOF'
          import shutil
          from PIL import Image
          res = "android/app/src/main/res"
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
          src = Image.open("icon.png").convert("RGBA")
          for d, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              im = src.copy()
              im.thumbnail((size, size))
              bg = Image.new("RGBA", (size, size), "white")
              bg.paste(im, ((size-im.width)//2, (size-im.height)//2), im)
              for n in ("ic_launcher.png","ic_launcher_round.png","ic_launcher_foreground.png"):
                  bg.convert("RGB").save(res + "/mipmap-" + d + "/" + n)
          EOF

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seragam-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
